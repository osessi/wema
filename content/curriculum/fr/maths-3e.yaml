grade: 3e
subject: maths
units:
  - name: Arithmétique
    notions:
      - code: nombres-premiers
        name: Nombres premiers et décomposition
        description: Reconnaître un nombre premier et décomposer un entier en produit de facteurs premiers.
        misconceptions:
          - key: un-est-premier
            description: Considère 1 comme un nombre premier.
          - key: impair-donc-premier
            description: Croit que tout nombre impair est premier, par exemple 9, 15 ou 21.
          - key: decomposition-non-premiere
            description: S'arrête à une décomposition dont un facteur n'est pas premier, par exemple 60 = 4 × 15.
      - code: fractions-irreductibles
        name: Fractions irréductibles
        description: Rendre une fraction irréductible en s'appuyant sur la décomposition en facteurs premiers du numérateur et du dénominateur.
        prerequisites: [nombres-premiers, fractions-operations]
        misconceptions:
          - key: simplification-partielle
            description: Simplifie une seule fois, par exemple 24/36 = 12/18, et croit la fraction irréductible.
          - key: simplifie-par-soustraction
            description: Retire le même nombre au numérateur et au dénominateur au lieu de les diviser.
  - name: Calcul littéral
    notions:
      - code: identites-remarquables
        name: Identités remarquables
        description: Développer (a + b)², (a − b)² et (a + b)(a − b), et reconnaître ces formes pour factoriser.
        prerequisites: [double-distributivite]
        misconceptions:
          - key: carre-somme-sans-double-produit
            description: Écrit (a + b)² = a² + b² en oubliant le double produit 2ab.
          - key: signe-double-produit
            description: Écrit (a − b)² = a² − 2ab − b² ou a² + 2ab + b².
          - key: carre-du-coefficient
            description: Développe (3x + 1)² en 3x² + 6x + 1 en ne mettant pas au carré le coefficient de x.
      - code: factorisation
        name: Factorisation
        description: Factoriser une expression à l'aide d'un facteur commun ou de l'identité a² − b² = (a + b)(a − b).
        prerequisites: [identites-remarquables]
        misconceptions:
          - key: facteur-commun-incomplet
            description: Oublie le terme 1 en factorisant, par exemple écrit 3x + 3 = 3(x).
          - key: factorise-une-somme-de-carres
            description: Factorise x² + 9 en (x + 3)(x − 3).
          - key: developpe-au-lieu-de-factoriser
            description: Répond par une expression développée alors qu'un produit est demandé.
      - code: equations-produit-nul
        name: Équations produit nul
        description: Résoudre une équation de la forme (ax + b)(cx + d) = 0 en utilisant le fait qu'un produit est nul si et seulement si l'un de ses facteurs est nul.
        prerequisites: [equations-1er-degre, factorisation]
        misconceptions:
          - key: developpe-l-equation
            description: Développe le produit au lieu d'utiliser la propriété du produit nul, et ne sait plus conclure.
          - key: une-seule-solution
            description: Ne donne la solution que d'un des deux facteurs.
          - key: produit-egal-non-nul
            description: Applique la propriété à un produit égal à un nombre non nul, par exemple (x − 1)(x + 2) = 4.
  - name: Inéquations
    notions:
      - code: inequations-1er-degre
        name: Inéquations du premier degré
        description: Résoudre une inéquation du premier degré à une inconnue et représenter ses solutions sur une droite graduée.
        prerequisites: [equations-1er-degre]
        misconceptions:
          - key: sens-non-change-negatif
            description: Ne change pas le sens de l'inégalité en multipliant ou divisant les deux membres par un nombre négatif.
          - key: solution-unique
            description: Donne une seule valeur comme solution au lieu d'un ensemble de nombres.
          - key: crochet-borne
            description: Inclut ou exclut la borne à tort selon que l'inégalité est stricte ou large.
  - name: Fonctions
    notions:
      - code: notion-fonction
        name: Notion de fonction
        description: Utiliser le vocabulaire et les notations d'une fonction (image, antécédent, f(x)) à partir d'une formule, d'un tableau ou d'une courbe.
        prerequisites: [calcul-litteral]
        misconceptions:
          - key: confond-image-antecedent
            description: Lit une abscisse quand on demande l'image d'un nombre, ou l'inverse.
          - key: fx-produit
            description: Lit f(3) comme le produit de f par 3.
          - key: antecedent-unique
            description: Croit qu'un nombre a toujours un seul antécédent.
      - code: fonctions-lineaires
        name: Fonctions linéaires
        description: Reconnaître et utiliser une fonction linéaire x ↦ ax, la relier à la proportionnalité et à une droite passant par l'origine.
        prerequisites: [notion-fonction, proportionnalite]
        misconceptions:
          - key: toute-droite-lineaire
            description: Croit que toute fonction représentée par une droite est linéaire, même si la droite ne passe pas par l'origine.
          - key: coefficient-mal-calcule
            description: Calcule le coefficient a comme x / f(x) au lieu de f(x) / x.
      - code: fonctions-affines
        name: Fonctions affines
        description: Reconnaître une fonction affine x ↦ ax + b, interpréter a et b, calculer des images et tracer sa représentation graphique.
        prerequisites: [fonctions-lineaires]
        misconceptions:
          - key: inverse-a-et-b
            description: Prend l'ordonnée à l'origine pour le coefficient directeur, ou l'inverse.
          - key: coefficient-directeur-un-point
            description: Calcule le coefficient directeur avec un seul point, comme f(x) / x.
          - key: affine-proportionnelle
            description: Croit que les images d'une fonction affine sont proportionnelles aux nombres de départ.
  - name: Pourcentages
    notions:
      - code: pourcentages
        name: Pourcentages et évolutions
        description: Appliquer un pourcentage, calculer une augmentation ou une diminution à l'aide d'un coefficient multiplicateur.
        prerequisites: [proportionnalite]
        misconceptions:
          - key: evolutions-successives-additionnees
            description: Croit que deux hausses successives de 10 % font une hausse de 20 %.
          - key: baisse-annule-hausse
            description: Croit qu'une baisse de 20 % annule une hausse de 20 %.
          - key: coefficient-mal-forme
            description: Utilise 0,2 au lieu de 1,2 pour une hausse de 20 %, ou 1,2 au lieu de 0,8 pour une baisse.
  - name: Thalès et trigonométrie
    notions:
      - code: thales-reciproque
        name: Thalès en configuration papillon et réciproque
        description: Utiliser le théorème de Thalès dans les deux configurations, et sa réciproque pour démontrer que deux droites sont parallèles.
        prerequisites: [thales]
        misconceptions:
          - key: alignement-ordre
            description: Utilise la réciproque sans vérifier que les points sont alignés dans le même ordre.
          - key: egalite-approchee
            description: Conclut au parallélisme à partir de rapports arrondis presque égaux.
      - code: trigonometrie
        name: Trigonométrie dans le triangle rectangle
        description: Utiliser le cosinus, le sinus et la tangente d'un angle aigu d'un triangle rectangle pour calculer une longueur ou un angle.
        prerequisites: [pythagore, proportionnalite]
        misconceptions:
          - key: cote-adjacent-oppose
            description: Confond le côté adjacent et le côté opposé à l'angle considéré.
          - key: calculatrice-mode-angle
            description: Calcule avec la calculatrice réglée en radians au lieu de degrés.
          - key: angle-droit
            description: Applique les formules à l'angle droit ou dans un triangle qui n'est pas rectangle.
  - name: Probabilités
    notions:
      - code: probabilites
        name: Probabilités
        description: Calculer la probabilité d'un événement dans une situation d'équiprobabilité, et celle de l'événement contraire.
        prerequisites: [fractions-operations]
        misconceptions:
          - key: equiprobabilite-abusive
            description: Croit que toutes les issues sont équiprobables, par exemple pour la somme de deux dés.
          - key: memoire-du-hasard
            description: Croit qu'après plusieurs « pile », « face » a plus de chances de sortir.
          - key: probabilite-superieure-a-un
            description: Donne une probabilité supérieure à 1 ou négative sans s'en étonner.
  - name: Géométrie dans l'espace
    notions:
      - code: sphere-boule
        name: Sphère et boule
        description: Calculer l'aire d'une sphère et le volume d'une boule, et se repérer sur une sphère.
        prerequisites: [volumes-pyramide-cone]
        misconceptions:
          - key: diametre-pour-rayon
            description: Utilise le diamètre à la place du rayon dans la formule.
          - key: confond-aire-volume
            description: Confond les formules 4πr² et (4/3)πr³.

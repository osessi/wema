grade: 5e
subject: maths
units:
  - name: Calcul littéral
    notions:
      - code: calcul-litteral
        name: Calcul littéral
        description: Utiliser des lettres pour représenter des nombres, réduire et développer des expressions.
        misconceptions:
          - key: additionne-termes-non-semblables
            description: Additionne des termes qui ne sont pas semblables, par exemple écrit 2x + 3 = 5x.
          - key: confond-2x-et-x-carre
            description: Confond 2x (x + x) et x² (x × x).
          - key: distributivite-partielle
            description: Ne distribue le facteur que sur le premier terme, par exemple k(a + b) = ka + b.

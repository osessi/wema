# Environnement local : une seule base Postgres (données, journal d'événements, file de tâches).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wema
      POSTGRES_PASSWORD: wema
      POSTGRES_DB: wema
    # Base de développement (mot de passe connu) : joignable seulement depuis cette machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

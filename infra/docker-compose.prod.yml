# Production Wema : un serveur, Docker. Mode d'emploi : docs/deploiement.md.
#   cp infra/env.prod.example infra/.env   # puis renseigner les valeurs
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# Seul Caddy est exposé (80 et 443, certificats HTTPS automatiques) ; la base,
# services/math, l'API et le web ne sont joignables que sur le réseau interne.
name: wema

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wema
      POSTGRES_DB: wema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à renseigner dans infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wema -d wema"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  math:
    build: ../services/math
    image: wema-math:${WEMA_VERSION:-latest}
    restart: unless-stopped
    environment:
      WEMA_MATH_WORKERS: ${WEMA_MATH_WORKERS:-4}
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: wema-api:${WEMA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      math:
        condition: service_healthy
    # Toutes les variables de infra/.env (prestataires d'envoi, IA, connexion
    # Google/Apple…, voir .env.example à la racine) ; celles ci-dessous priment.
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://wema:${POSTGRES_PASSWORD}@postgres:5432/wema
      WEMA_MATH_URL: http://math:8000
      WEMA_PUBLIC_URL: https://${WEMA_DOMAIN:?à renseigner dans infra/.env}
      WEMA_CODE_SECRET: ${WEMA_CODE_SECRET:?à renseigner dans infra/.env}
      WEMA_HEALTH_KEY: ${WEMA_HEALTH_KEY:?à renseigner dans infra/.env}
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        WEMA_API_URL: http://api:4000
    image: wema-web:${WEMA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEMA_API_URL: http://api:4000
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      WEMA_DOMAIN: ${WEMA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?à renseigner dans infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  # Sauvegarde quotidienne de la base (pg_dump compressé) dans infra/backups,
  # avec rotation. Restauration : infra/restore.sh.
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: wema
      PGDATABASE: wema
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
